<!DOCTYPE html>
<html lang="en">
  <head>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <meta name="referrer" content="no-referrer" />
  
  <style>
    @layer base { html, body { margin: 0; padding: 0; } body { overscroll-behavior: none; } }
    ::-webkit-scrollbar { display: none; }
    
    /* THE THEME ENGINE */
    :root {
      /* LIGHT MODE VARIABLES */
      --bg-base: #f0f4f8;
      --surface-glass: rgba(255, 255, 255, 0.6);
      --surface-solid: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-subtle: rgba(15, 23, 42, 0.08);
      --input-bg: rgba(255, 255, 255, 0.9);
    }
    .dark {
      /* DARK MODE VARIABLES (Your original beautiful glass theme) */
      --bg-base: #0c1324;
      --surface-glass: rgba(25, 31, 49, 0.6);
      --surface-solid: #151b2d;
      --text-main: #dce1fb;
      --text-muted: #8c909f;
      --border-subtle: rgba(255, 255, 255, 0.05);
      --input-bg: rgba(12, 19, 36, 0.8);
    }
    
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      transition: background-color 0.4s ease, color 0.4s ease;
    }
  </style>

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=JetBrains+Mono:wght@100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            /* Mapped to CSS Variables for seamless toggling */
            "bg-base": "var(--bg-base)",
            "surface-glass": "var(--surface-glass)",
            "surface-solid": "var(--surface-solid)",
            "text-main": "var(--text-main)",
            "text-muted": "var(--text-muted)",
            "border-subtle": "var(--border-subtle)",
            "input-bg": "var(--input-bg)",
            
            /* Universal Accents (Look good on both) */
            "primary": "#adc6ff", "electric-blue": "#3b82f6", 
            "secondary": "#4edea3", "emerald-metric": "#10b981", 
            "tertiary": "#ffb786", "tertiary-container": "#df7412",
            "urgent-red": "#ef4444"
          },
          fontFamily: {
            "label-caps": ["Geist", "sans-serif"], "metric-xl": ["Geist", "sans-serif"], 
            "body-md": ["Inter", "sans-serif"], "headline-lg": ["Geist", "sans-serif"], 
            "body-sm": ["Inter", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
