<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas Intelligence</title>

    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        /* COLORS ARE SAFE INSIDE EXTEND */
        colors: {
          "background": "#0c1324", "primary-fixed": "#d8e2ff", "tertiary-fixed": "#ffdcc6", "tertiary-fixed-dim": "#ffb786",
          "on-secondary-container": "#00311f", "surface-container": "#191f31", "secondary-fixed-dim": "#4edea3",
          "secondary-container": "#00a572", "tertiary-container": "#df7412", "primary": "#adc6ff", "error-container": "#93000a",
          "inverse-primary": "#005ac2", "surface-container-low": "#151b2d", "surface-dim": "#0c1324", "primary-fixed-dim": "#adc6ff",
          "on-secondary-fixed-variant": "#005236", "on-primary-fixed": "#001a42", "surface-container-highest": "#2e3447",
          "surface-bright": "#33394c", "on-background": "#dce1fb", "on-tertiary-container": "#461f00", "electric-blue": "#3b82f6",
          "on-surface": "#dce1fb", "inverse-surface": "#dce1fb", "emerald-metric": "#10b981", "on-tertiary-fixed": "#311400",
          "outline-variant": "#424754", "surface-container-high": "#23293c", "urgent-red": "#ef4444", "surface-container-lowest": "#070d1f",
          "on-primary": "#002e6a", "on-primary-fixed-variant": "#004395", "primary-container": "#4d8eff", "secondary": "#4edea3",
          "on-surface-variant": "#c2c6d6", "inverse-on-surface": "#2a3043", "outline": "#8c909f", "secondary-fixed": "#6ffbbe",
          "surface-tint": "#adc6ff", "error": "#ffb4ab", "on-error-container": "#ffdad6", "surface": "#0c1324", "tertiary": "#ffb786",

          "on-tertiary": "#502400", "border-subtle": "#1e293b", "on-tertiary-fixed-variant": "#723600", "bg-slate-950": "#020617",
          "on-primary-container": "#00285d", "on-secondary": "#003824"

        /* MOVED THESE INSIDE EXTEND SO DEFAULT TAILWIND KEEPS WORKING! */

        spacing: { "container-max": "1440px", "margin-desktop": "32px", "margin-mobile": "16px", "gutter": "24px", "unit": "4px" },
        fontFamily: {
          "label-caps": ["Geist", "sans-serif"], "metric-xl": ["Geist", "sans-serif"], "body-md": ["Inter", "sans-serif"],
          "headline-lg": ["Geist", "sans-serif"], "headline-lg-mobile": ["Geist", "sans-serif"], "display-lg": ["Geist", "sans-serif"],
          "body-sm": ["Inter", "sans-serif"]
        },
        fontSize: {
          "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
          "metric-xl": ["36px", { lineHeight: "44px", letterSpacing: "-0.01em", fontWeight: "700" }],
          "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
          "headline-lg": ["32px", { lineHeight: "40px", fontWeight: "600" }],

    <div id="root"></div>
