name: Backend security checks

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-security.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-security.yml"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run security regression tests
        run: npm run test:security

      - name: Check backend syntax
        run: |
          node --check server.js
          node --check Security.js
          node --check AtlasExtensions.js
          node --check GoogleAdsScannerBroad.js
          node --check GoogleAdsScannerV2.js
          node --check GoogleAdsScannerV3.js
          node --check GoogleAdsScannerV5.js
          node --check GoogleAdsScannerV6.js
          node --check AutomatedReport.js
