name: Video Library metadata checks

on:
  pull_request:
    paths:
      - 'backend/VideoLibraryMetadata.js'
      - 'backend/AtlasExtensions.js'
      - '.github/workflows/video-library-metadata.yml'
  push:
    branches: [main]
    paths:
      - 'backend/VideoLibraryMetadata.js'
      - 'backend/AtlasExtensions.js'
      - '.github/workflows/video-library-metadata.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check VideoLibraryMetadata.js
      - run: node --check AtlasExtensions.js
